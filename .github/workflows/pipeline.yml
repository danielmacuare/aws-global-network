---
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  id-token: write   # Required for OIDC authentication with AWS

env:
  INFRACOST_ENABLE_CLOUD: false
  AWS_DEFAULT_REGION: eu-west-2
  TF_CLI_ARGS_init: "-backend=false"
  # Allow parallel terraform init to share a plugin cache without "text file busy" errors on Linux
  TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Run on PRs — generate cost diff and post a comment
  # -----------------------------------------------------------------------
  infracost:
    name: Infracost - PR Comment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: "v0.10.43"

      # Checkout the base branch to generate the cost baseline
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Configure AWS credentials (base branch)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Generate cost estimate baseline
        run: |
          CONFIG=$([ -f tools/infracost.yml ] && echo tools/infracost.yml || echo infracost.yml)
          infracost breakdown \
            --config-file=$CONFIG \
            --format=json \
            --out-file=/tmp/infracost-base.json

      # Checkout the PR branch to generate the cost diff
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Configure AWS credentials (PR branch)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Generate cost diff
        run: |
          infracost diff \
            --config-file=tools/infracost.yml \
            --format=json \
            --compare-to=/tmp/infracost-base.json \
            --out-file=/tmp/infracost.json

      # Post or update a single comment on the PR
      - name: Post Infracost comment
        run: |
          infracost comment github \
            --path=/tmp/infracost.json \
            --repo=${{ github.repository }} \
            --github-token=${{ github.token }} \
            --pull-request=${{ github.event.number }} \
            --behavior=update

  # -----------------------------------------------------------------------
  # Job 2: Check terraform-docs are up to date on PRs
  # -----------------------------------------------------------------------
  terraform-docs:
    name: Terraform Docs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run terraform-docs check
        uses: terraform-docs/gh-actions@v1
        with:
          version: "v0.21.0"
          working-dir: >-
            modules/create-ec2,
            modules/create-key-pair,
            modules/create-tgw,
            modules/create-tgw-vpc-attachment,
            modules/create-vpc,
            modules/security
          output-file: README.md
          output-method: inject
          fail-on-diff: false
          git-push: true # Automatically commit the fix to the PR

  # -----------------------------------------------------------------------
  # Job 3: Validate Terraform on PRs
  # -----------------------------------------------------------------------
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"

      - name: Run terraform validate across all Terraform directories
        run: |
          set -euo pipefail
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          find bootstrap envs modules -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u | \
            xargs -P "$(nproc)" -I{} sh -c \
              'echo "==> Validating: {}" && terraform -chdir="{}" init -backend=false -input=false -no-color && terraform -chdir="{}" validate -no-color'

  # -----------------------------------------------------------------------
  # Job 4: Lint Terraform on PRs
  # -----------------------------------------------------------------------
  tflint:
    name: Linting - TFLINT
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.61.0

      - name: Init tflint (download AWS ruleset plugin)
        run: tflint --init --config=tools/.tflint.hcl

      - name: Run tflint across all Terraform directories
        run: |
          set -euo pipefail
          export TFLINT_CONFIG="$GITHUB_WORKSPACE/tools/.tflint.hcl"
          find bootstrap envs modules -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u | \
            xargs -P "$(nproc)" -I{} sh -c \
              'echo "==> Linting: {}" && tflint --config="$TFLINT_CONFIG" --chdir="{}"'

  # -----------------------------------------------------------------------
  # Job 5: Checkov static security analysis on PRs
  # -----------------------------------------------------------------------
  checkov:
    name: Static Code Analysis - CHECKOV
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Run Checkov
        run: |
          uv run checkov \
            --config-file tools/.checkov.yaml \
            --soft-fail-on LOW,MEDIUM \
            --hard-fail-on HIGH,CRITICAL

  # -----------------------------------------------------------------------
  # Job 6: Run on push to main — update the baseline breakdown
  # -----------------------------------------------------------------------
  infracost-baseline:
    name: Infracost - Baseline Update
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: "v0.10.43"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Generate baseline breakdown
        run: |
          infracost breakdown \
            --config-file=tools/infracost.yml \
            --format=table
