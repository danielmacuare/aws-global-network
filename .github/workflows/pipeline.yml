---
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  pull-requests: write
  contents: read
  id-token: write   # Required for OIDC authentication with AWS

env:
  INFRACOST_ENABLE_CLOUD: false
  AWS_DEFAULT_REGION: eu-west-2
  TF_CLI_ARGS_init: "-backend=false"

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Run on PRs — generate cost diff and post a comment
  # -----------------------------------------------------------------------
  infracost:
    name: Infracost PR Comment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # Checkout the base branch to generate the cost baseline
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Configure AWS credentials (base branch)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Generate cost estimate baseline
        run: |
          CONFIG=$([ -f tools/infracost.yml ] && echo tools/infracost.yml || echo infracost.yml)
          infracost breakdown \
            --config-file=$CONFIG \
            --format=json \
            --out-file=/tmp/infracost-base.json

      # Checkout the PR branch to generate the cost diff
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Configure AWS credentials (PR branch)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Generate cost diff
        run: |
          infracost diff \
            --config-file=tools/infracost.yml \
            --format=json \
            --compare-to=/tmp/infracost-base.json \
            --out-file=/tmp/infracost.json

      # Post or update a single comment on the PR
      - name: Post Infracost comment
        run: |
          infracost comment github \
            --path=/tmp/infracost.json \
            --repo=${{ github.repository }} \
            --github-token=${{ github.token }} \
            --pull-request=${{ github.event.number }} \
            --behavior=update

  # -----------------------------------------------------------------------
  # Job 2: Check terraform-docs are up to date on PRs
  # -----------------------------------------------------------------------
  terraform-docs:
    name: Terraform Docs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Run terraform-docs check
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: >-
            modules/create-ec2,
            modules/create-key-pair,
            modules/create-tgw,
            modules/create-tgw-vpc-attachment,
            modules/create-vpc,
            modules/security
          output-file: README.md
          output-method: inject
          fail-on-diff: true

  # -----------------------------------------------------------------------
  # Job 3: Lint Terraform on PRs
  # -----------------------------------------------------------------------
  tflint:
    name: TFLINT
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Init tflint (download AWS ruleset plugin)
        run: tflint --init --config=tools/.tflint.hcl

      - name: Run tflint across all Terraform directories
        run: |
          set -euo pipefail
          FAILED=0
          while IFS= read -r dir; do
            echo "==> Linting: $dir"
            tflint --config="$GITHUB_WORKSPACE/tools/.tflint.hcl" --chdir="$dir" || FAILED=1
          done < <(find modules envs -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u)
          exit $FAILED

  # -----------------------------------------------------------------------
  # Job 4: Checkov static security analysis on PRs
  # -----------------------------------------------------------------------
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Run Checkov
        run: |
          uv run checkov \
            --config-file tools/.checkov.yaml \
            --directory . \
            --soft-fail-on LOW,MEDIUM \
            --hard-fail-on HIGH,CRITICAL

  # -----------------------------------------------------------------------
  # Job 5: Trivy IaC misconfiguration scan on PRs
  # -----------------------------------------------------------------------
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: tools/trivy.yaml
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  # -----------------------------------------------------------------------
  # Job 6: Run on push to main — update the baseline breakdown
  # -----------------------------------------------------------------------
  infracost-baseline:
    name: Infracost Baseline Update
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Generate baseline breakdown
        run: |
          infracost breakdown \
            --config-file=tools/infracost.yml \
            --format=table
