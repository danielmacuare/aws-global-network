# tools/trivy.yaml
# Trivy IaC misconfiguration scanning configuration.
# Used by both the prek pre-commit hook and the CI pipeline job.

scan:
  scanners:
    - misconfig

severity:
  - HIGH
  - CRITICAL

exit-code: 1

skip-dirs:
  - .git
  - .terraform
  - .tflint_plugins
  - .venv

# Intentional suppressions live in .trivyignore at the repo root.
# skip-checks is not supported for config scanning; .trivyignore is the correct mechanism.
ignorefile: tools/.trivyignore
